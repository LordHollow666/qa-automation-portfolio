name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegador de Playwright
        run: playwright install --with-deps chromium

            - name: Ejecutar pruebas
        run: pytest -v --html=reports/report.html --self-contained-html --tracing retain-on-failure --screenshot only-on-failure

      - name: Guardar reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-html
          path: reports/report.html

      - name: Guardar evidencia si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-fallos
          path: test-results/